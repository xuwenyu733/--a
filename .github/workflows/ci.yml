name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:helpers
      - run: npm run test:unit

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_MEMORY_SERVER_DOWNLOAD_DIR: .cache/mongodb-memory-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB memory-server binary
        uses: actions/cache@v4
        with:
          path: backend/.cache/mongodb-memory-server
          key: mongodb-ms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-ms-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:integration

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  uniapp-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - run: npm ci
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-secrets.mjs
