# 校园二手 — Nginx 站点配置模板
# 安装：sudo cp 本文件 /etc/nginx/sites-available/campus-secondhand
# 启用：sudo ln -s .../sites-available/campus-secondhand /etc/nginx/sites-enabled/
# 测试：sudo nginx -t && sudo systemctl reload nginx

upstream campus_secondhand {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    # 有域名时改为实际域名；仅 IP 访问可写 server_name _;
    server_name your-domain.com;

    # 上传图片大小限制
    client_max_body_size 10m;

    access_log /var/log/nginx/campus-secondhand.access.log;
    error_log  /var/log/nginx/campus-secondhand.error.log;

    # 本地存储方案 A（推荐）：注释下面整块，全部由 Node 提供 /uploads
    # 本地存储方案 B：由 Nginx 直接读磁盘（略省 Node 负载）
    location /uploads/ {
        alias /opt/campus-secondhand/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API、WebSocket、SPA 统一反代到 Node
    location / {
        proxy_pass http://campus_secondhand;
        proxy_http_version 1.1;

        # WebSocket 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS 由 certbot 自动追加 server { listen 443 ssl; ... } 块
# 或手动配置 ssl_certificate / ssl_certificate_key
